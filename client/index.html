<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />

    <!--app-head-->

    <!-- ── Non-SEO head (static, kept) ──────────────────────────────── -->
    <meta name="keywords" content="AI chatbot, intelligent chatbot, website chatbot, virtual assistant, automated chatbot, chatbot SaaS, white label chatbot, chatbot for business, AI customer support" />
    <meta name="author" content="Lynx AI" />
    <meta name="twitter:site" content="@lynxaiassistant" />

    <!-- ── Theme & PWA ────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#0b1220" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicon ───────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png" />

    <!-- ── Theme: dark is the default. Apply an explicit light choice before
         first paint so nobody sees a flash of the wrong theme. ─────────── -->
    <script>try{if(localStorage.getItem("lynx-theme-choice")==="light")document.documentElement.classList.remove("dark")}catch(e){}</script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
